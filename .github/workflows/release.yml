name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  VSCE_PAT: ${{ secrets.VSCE_PAT }}
  CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
  PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
  PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://gdbryant.github.io/Stewart/updatePlugins.xml
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Resolve tag version
        id: ver
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag is not semver: $GITHUB_REF_NAME" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vscode_version=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "${VERSION%%-*}" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Package VS Code extension at the tag version
        run: |
          V="${{ steps.ver.outputs.vscode_version }}"
          if [ "${{ steps.ver.outputs.prerelease }}" = "true" ]; then
            pnpm --filter stewart exec vsce package "$V" --pre-release --no-dependencies --skip-license --out "stewart-$V.vsix" </dev/null
          else
            pnpm --filter stewart exec vsce package "$V" --no-dependencies --skip-license --out "stewart-$V.vsix" </dev/null
          fi
        working-directory: hosts/vscode

      - name: Build per-OS JetBrains zips with bundled Node
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p release-out
          for key in linux-x64 linux-arm64 macos-x64 macos-arm64 windows-x64; do
            rm -rf dist/node
            node scripts/bundle-node.mjs "$key"
            ./gradlew buildPlugin -Pversion="$VERSION" -q
            mv build/distributions/stewart-*.zip "release-out/stewart-${VERSION}-${key}.zip"
          done
          rm -rf dist/node
          ./gradlew buildPlugin -Pversion="$VERSION" -q
          mv build/distributions/stewart-*.zip "release-out/stewart-${VERSION}.zip"

      - name: Fail if built artifact versions differ from the tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          VSCODE_VERSION="${{ steps.ver.outputs.vscode_version }}"
          unzip -p "release-out/stewart-${VERSION}.zip" "stewart/lib/stewart-${VERSION}.jar" > /tmp/plugin.jar
          unzip -p /tmp/plugin.jar META-INF/plugin.xml | grep "<version>${VERSION}</version>"
          unzip -p "hosts/vscode/stewart-${VSCODE_VERSION}.vsix" extension/package.json | grep "\"version\": \"${VSCODE_VERSION}\""

      - name: Generate JetBrains update feed
        if: steps.ver.outputs.prerelease == 'false'
        run: |
          node scripts/gen-update-feed.mjs "${{ steps.ver.outputs.version }}" updatePlugins.xml
          mkdir -p pages && cp updatePlugins.xml pages/

      - name: Sign JetBrains plugin (when signing secrets are set)
        if: env.CERTIFICATE_CHAIN != '' && env.PRIVATE_KEY != ''
        run: |
          rm -rf dist/node
          ./gradlew signPlugin -Pversion="${{ steps.ver.outputs.version }}" -q
          mv build/distributions/stewart-*-signed.zip release-out/ 2>/dev/null || true

      - name: Create GitHub release
        run: |
          set -euo pipefail
          EXTRA=""
          PRE=""
          if [ "${{ steps.ver.outputs.prerelease }}" = "true" ]; then PRE="--prerelease"; fi
          if [ -f updatePlugins.xml ]; then EXTRA="updatePlugins.xml"; fi
          gh release create "${{ github.ref_name }}" $PRE --title "Stewart ${{ github.ref_name }}" --generate-notes release-out/* "hosts/vscode/stewart-${{ steps.ver.outputs.vscode_version }}.vsix" $EXTRA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish update feed to GitHub Pages (non-prerelease)
        if: steps.ver.outputs.prerelease == 'false'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - name: Deploy update feed to GitHub Pages (non-prerelease)
        if: steps.ver.outputs.prerelease == 'false'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Publish VSIX to marketplace (non-prerelease, when VSCE_PAT is set)
        if: env.VSCE_PAT != '' && steps.ver.outputs.prerelease == 'false'
        run: pnpm --filter stewart exec vsce publish --packagePath "stewart-${{ steps.ver.outputs.vscode_version }}.vsix" -p "$VSCE_PAT"
        working-directory: hosts/vscode
